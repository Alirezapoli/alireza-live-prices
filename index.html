
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIREZA Live Crypto</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
}
.wallpaper {
  min-height: 100vh;
  background: url("wallpaper.png") center center / contain no-repeat;
  position: relative;
  padding: 18px 12px;
}
.panel {
  width: min(330px, 94%);
  margin: 0 auto;
  background: rgba(3, 8, 20, .93);
  border: 1px solid #16e6ad;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 0 18px #00e6a355;
}
h2 {
  margin: 0 0 10px;
  text-align: center;
  color: #16e6ad;
  letter-spacing: 2px;
  font-size: 20px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 2px;
  border-bottom: 1px solid #263349;
  gap: 8px;
}
.row:last-child { border-bottom: 0; }
.coin { font-weight: bold; }
.price { text-align: right; font-variant-numeric: tabular-nums; }
.change { font-size: 12px; margin-top: 4px; }
.green { color: #21f59b; }
.red { color: #ff5268; }
.status {
  text-align: center;
  color: #a9b7cb;
  font-size: 11px;
  margin-top: 10px;
}
</style>
</head>
<body>
<div class="wallpaper">
  <div class="panel">
    <h2>ALIREZA LIVE</h2>
    <div id="prices">Connecting to Exir...</div>
    <div class="status" id="status">Connecting to Exir market</div>
  </div>
</div>

<script>
const coins = [
  { symbol: "BTC", pair: "btc-usdt" },
  { symbol: "ETH", pair: "eth-usdt" },
  { symbol: "SOL", pair: "sol-usdt" },
  { symbol: "XRP", pair: "xrp-usdt" },
  { symbol: "DOGE", pair: "doge-usdt" }
];

const prices = document.getElementById("prices");
const statusBox = document.getElementById("status");
const previous = {};

function formatPrice(value) {
  const number = Number(value);
  return number.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: number < 1 ? 6 : 2
  });
}

async function getTicker(coin) {
  const url = "https://api.exir.io/v2/ticker?symbol=" + coin.pair;
  const response = await fetch(url, { cache: "no-store" });

  if (!response.ok) {
    throw new Error(coin.symbol + " request failed: " + response.status);
  }

  const ticker = await response.json();
  const last = Number(ticker.last);
  const open = Number(ticker.open);

  if (!Number.isFinite(last) || last <= 0) {
    throw new Error("Invalid price for " + coin.symbol);
  }

  return {
    symbol: coin.symbol,
    price: last,
    open: Number.isFinite(open) && open > 0 ? open : null
  };
}

async function updatePrices() {
  statusBox.textContent = "Updating prices...";

  const results = await Promise.all(
    coins.map(async coin => {
      try {
        return await getTicker(coin);
      } catch (error) {
        return { symbol: coin.symbol, error: true };
      }
    })
  );

  prices.innerHTML = results.map(item => {
    if (item.error) {
      return `<div class="row">
        <div class="coin">${item.symbol}/USDT</div>
        <div class="price red">Unavailable</div>
      </div>`;
    }

    const change = item.open === null
      ? null
      : ((item.price - item.open) / item.open) * 100;

    const direction = previous[item.symbol] === undefined
      ? (change === null || change >= 0)
      : item.price >= previous[item.symbol];

    previous[item.symbol] = item.price;

    const priceClass = direction ? "green" : "red";
    const changeClass = change === null
      ? ""
      : change >= 0 ? "green" : "red";
    const sign = change !== null && change > 0 ? "+" : "";

    return `<div class="row">
      <div class="coin">${item.symbol}/USDT</div>
      <div class="price">
        <div class="${priceClass}">${formatPrice(item.price)}</div>
        <div class="change ${changeClass}">
          ${change === null ? "24h change unavailable" :
            sign + change.toFixed(2) + "% (24h)"}
        </div>
      </div>
    </div>`;
  }).join("");

  const successful = results.filter(item => !item.error).length;

  statusBox.textContent = successful === coins.length
    ? "Exir Live • Updated " + new Date().toLocaleTimeString()
    : successful + "/5 markets connected • Retrying...";
}

async function refresh() {
  try {
    await updatePrices();
  } catch (error) {
    statusBox.textContent = "Connection failed • Retrying...";
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
